# Render Blueprint - AI Gym Buddy
# This file tells Render how to deploy your app

services:
  - type: web
    name: aigymbuddy-api
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py 2>/dev/null || true && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aigymbuddy-db
          property: connectionString

databases:
  - name: aigymbuddy-db
    databaseName: aigymbuddy
    user: aigymbuddy
    plan: free
