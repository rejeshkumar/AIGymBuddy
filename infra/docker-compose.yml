version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: gym-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - gym_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: gym-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:pass@postgres:5432/postgres
    depends_on:
      - postgres

volumes:
  gym_postgres_data:
